id: pushup_palms
version: 1.5.0
title: Full-amplitude chest-level palms with a declared wrist envelope and recorded muscle activity
engine: mujoco
engine_version: 3.17.0
model: ms_human_700
model_revision: 98a70c569c4c1b6da467a20012f766ee1f8dc521
backend: pushup
method: dynamic_forward
required_capabilities:
- dynamic_forward
- muscle_activation
- actuator_force
- muscle_actuated_dynamics
- motion_visualization
scope: Standard-width palms at chest level, 31 cm between supports, with a synthetic
  full-amplitude reference from 0.1 to 1.9 rad elbow flexion. Only two wrist extension
  coordinate bounds differ from the source model, using a separately declared
  literature-informed envelope; geometric shaft extension is checked at every step.
  This is not subject calibration or evidence of pure muscle-driven control.
  Earlier chest_level partial motion and legacy_reach remain explicit for archive replay.
  Full primary 700-muscle body with source-derived rigid palms finger posture,
  genuine detailed hand meshes and 48 source hand transmissions. Wrist dynamics
  and multi-point hand contacts are measured. Prescribed sticking points prevent horizontal
  support drift; native floor normals remain unilateral. Bounded external residual joint assistance
  stabilizes the engineering reference; this is not pure muscle-driven control, finger
  dynamics or ligament tissue simulation. Read separate acceptance gates.
defaults:
  control: assisted_muscle
  muscle_strength_scale: 1.0
  friction: 1.3
  timestep_s: 0.0005
  render: false
  hand_support: palms
  support_boundary: fixed_points
  palm_technique: chest_full
