id: knee_coupled
version: 1.0.0
title: Knee source-equality path and effective moment arm
engine: mujoco
engine_version: 3.17.0
model: ms_human_700
model_revision: 98a70c569c4c1b6da467a20012f766ee1f8dc521
backend: joint_sweep
method: static_pose
required_capabilities: [musculotendon_length, moment_arm, coupled_knee_kinematics]
scope: >-
  Prescribe knee_angle_r and all eight directly coupled tibial/patellar coordinates
  from the pinned source equality polynomials including qpos0 references. Measure
  recfem_r path length and -dL/dq along that local path. Verify residuals, engine
  constraint-Jacobian tangent and independent finite differences. No time
  integration, global equilibrium, complete collision validity, experimental
  physiological knee comparison or clinical validation is established.
defaults:
  joint: knee_angle_r
  muscle: recfem_r
  start_rad: 0.2
  end_rad: 0.6
  samples: 9
  render: true
  coordinate_mode: coupled_knee
