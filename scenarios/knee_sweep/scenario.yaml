id: knee_sweep
version: 1.0.0
title: Right knee / rectus femoris prescribed pose sweep
engine: mujoco
engine_version: 3.17.0
model: ms_human_700
model_revision: 98a70c569c4c1b6da467a20012f766ee1f8dc521
backend: joint_sweep
method: static_pose
required_capabilities: [musculotendon_length, moment_arm]
scope: >-
  Measure the selected musculotendon path and partial moment arm at prescribed
  hinge coordinates; defaults use recfem_r about knee_angle_r, 0.2 to 1.0 rad.
  All other coordinates, including coupled knee and patellar coordinates,
  remain at upstream init. This is not constrained knee kinematics,
  equilibrium, force estimation, observed motion, or a medical assessment.
defaults:
  joint: knee_angle_r
  muscle: recfem_r
  start_rad: 0.2
  end_rad: 1.0
  samples: 9
  render: true
