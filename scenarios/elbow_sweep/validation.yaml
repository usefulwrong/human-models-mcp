validation_level: numerical_sanity
checks:
  finite_positive_path_lengths: true
  jacobian_central_difference:
    step_rad: 0.000001
    absolute_tolerance_m_per_rad: 0.00001
  repeat_run_absolute_tolerance_m: 0.000000000001
  default_configuration:
    path_length_change: negative
    signed_moment_arms: positive
limitations: This validates numerical consistency, not anatomical accuracy or clinical safety.
