id: pushup_palms_contact
version: 1.0.0
title: Experimental floor contact with rigid source fingers and no support guides
engine: mujoco
engine_version: 3.17.0
model: ms_human_700
model_revision: 98a70c569c4c1b6da467a20012f766ee1f8dc521
backend: pushup
method: dynamic_forward
required_capabilities: [dynamic_forward, muscle_activation, actuator_force, muscle_actuated_dynamics, motion_visualization]
scope: >-
  Experimental derivative of the synthetic chest-level palm reference. Native
  unilateral collision and friction supply ground reactions. Joint assistance
  is recorded and acceptance is independent of execution. Source fingers remain
  rigid. Collider geometry does not represent deformable tissue or skin pressure.
defaults:
  control: assisted_muscle
  muscle_strength_scale: 1.0
  friction: 0.8
  timestep_s: 0.0005
  render: false
  hand_support: palms
  support_boundary: frictional_contact
  contact_profile: surface_convex_v1
  palm_technique: chest_full
