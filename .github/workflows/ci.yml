name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify clean public checkout and nested archive content
        run: python3 scripts/public_check.py --strict-tree
      - name: Provision and build CPU runtime
        run: make build
      - name: Lint, unit, contract, scientific and package checks
        run: make test
      - name: Real SDK stdio and loopback HTTP
        run: make e2e
      - name: Muscle push-up, repeats and negative controls
        run: make pushup-e2e
      - name: Public links, privacy patterns and demo hashes
        run: python3 scripts/public_check.py
